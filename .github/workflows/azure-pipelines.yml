# Deploy II "Azure Pipelines" tab: same steps, run on GitHub runners (workflow tirith-ci-azure0)
name: 3 Azure Pipelines (emulated)
on:
  push:
    branches: [qa/tirith-ci-flows]
  pull_request:
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: |
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
      - uses: actions/setup-python@v5   # task: UsePythonVersion@0
        with: { python-version: '3.12' }
      - run: |
          pip install "git+https://github.com/StackGuardian/tirith.git@1.2.1"
          tirith platform check --workflow-id tirith-ci-azure0 --input-path plan.json --fail-on-error
        env:
          SG_API_TOKEN: ${{ secrets.SG_API_TOKEN }}
          SG_ORG: demo-org
          SG_BASE_URL: https://testapi.qa.stackguardian.io/api/v1
          SG_DASHBOARD_URL: https://dash.qa.stackguardian.io
      - run: terraform apply tfplan   # runs only if the check passes
